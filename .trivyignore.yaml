# Suppressions for the security workflow.
#
# Every entry MUST carry a statement saying why it is accepted and an
# expired_at date. A suppression without an expiry is a permanent silent
# acceptance, which is exactly what the gate exists to prevent: Trivy treats an
# expired entry as unsuppressed, so the finding returns and is re-judged rather
# than forgotten.
#
# Format:
#
# vulnerabilities:
#   - id: CVE-0000-00000
#     statement: Why this is accepted here, and what compensates for it.
#     expired_at: 2026-12-31
#
# Nothing is suppressed today.

vulnerabilities: []
